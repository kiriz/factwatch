name: CI

on:
  push:
    branches: [main]
    paths: ['agent/**', 'tests/**', 'pyproject.toml', '.github/workflows/ci.yml']
  pull_request:
    paths: ['agent/**', 'tests/**', 'pyproject.toml']

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check agent/ tests/

      - name: Test with coverage
        run: uv run pytest --cov=agent --cov-report=xml --cov-report=term -q

      - name: Update coverage badge
        if: github.ref == 'refs/heads/main'
        run: |
          uv run genbadge coverage -i coverage.xml -o .github/badges/coverage.svg
          if ! git diff --quiet .github/badges/coverage.svg; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .github/badges/coverage.svg
            git commit -m "ci: update coverage badge [skip ci]"
            git pull --rebase --autostash origin main
            git push
          fi
