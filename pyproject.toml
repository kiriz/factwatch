[project]
name = "factwatch-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "google-generativeai>=0.8.0",
    "pyyaml>=6.0",
    "python-frontmatter>=1.1.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
